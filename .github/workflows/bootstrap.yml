name: Expand Savrdh Education Source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap ]; then
            echo "Bootstrap payload already expanded."
            exit 0
          fi
          cat .bootstrap/payload.part* | base64 --decode > /tmp/savrdh-education.tgz
          tar -xzf /tmp/savrdh-education.tgz -C .
          rm -rf .bootstrap

      - name: Commit expanded application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Savrdh Education Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Build Savrdh Education LMS platform"
          git push origin HEAD:main
